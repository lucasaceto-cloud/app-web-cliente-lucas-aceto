<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título provisorio: js/producto.js lo reemplaza por el nombre real del producto -->
    <title>Vértice Ultralight | Detalle de producto</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/utilidades.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/almacen.js"></script>
    <script defer src="js/contador.js"></script>
    <script defer src="js/filtros.js"></script>
    <script defer src="js/producto.js"></script>
</head>
<body>

    <header>
        <h1><a href="index.html">Vértice Ultralight</a></h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html#catalogo">Catálogo</a></li>
                <li><a href="index.html#filosofia">Filosofía</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito (<span id="contador-mochila" aria-live="polite">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main id="producto">
        <!-- Miga de pan: la categoría y el nombre los completa js/producto.js -->
        <nav aria-label="Miga de pan">
            <p>
                <a href="index.html">Inicio</a> &gt;
                <a id="miga-categoria" href="index.html#catalogo">Catálogo</a> &gt;
                <span id="miga-producto" aria-current="page">Cargando…</span>
            </p>
        </nav>

        <!-- Estados: cargando / error de red / producto inexistente -->
        <p id="estado-producto" role="status"></p>

        <!-- Ficha: oculta hasta que el producto llega desde Supabase -->
        <article id="ficha" hidden>
            <h2 data-campo="nombre"></h2>
            <img data-campo="imagen" alt="" decoding="async">
            <p data-campo="descripcion"></p>
            <p><strong>Precio: <span data-campo="precio"></span></strong></p>

            <div class="agregar-producto">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="1" max="10">
                <button type="button" id="boton-agregar">🛒 Agregar a mi mochila</button>
                <button type="button">❤️ Guardar en Favoritos</button>
            </div>
            <p id="confirmacion-agregado" role="status"></p>

            <section>
                <h3>Especificaciones Técnicas</h3>
                <div class="tabla-scroll" role="region" tabindex="0" aria-label="Especificaciones técnicas">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Parámetro Técnico</th>
                                <th scope="col">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-especificaciones"></tbody>
                    </table>
                </div>
            </section>
        </article>

        <noscript><p>Activá JavaScript para ver el detalle del producto.</p></noscript>
    </main>

    <footer>
        <p>&copy; 2026 Vértice Ultralight - Aplicaciones Web Cliente (ISTEA). Todos los derechos reservados.</p>
    </footer>

</body>
</html>
